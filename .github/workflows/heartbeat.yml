name: Heartbeat
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PulseMon
        run: |
          curl -fsS -X POST https://pulsemon.dev/api/ping/github-heartbeat \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"Workflow: ${{ github.workflow }}\nRun: ${{ github.run_id }}\nTriggered by: ${{ github.event_name }}\nRunner: $(uname -s) $(uname -r)\"}"
